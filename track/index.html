<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>A iniciar download — English Dove</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:sans-serif;background:#0B1D3A;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:20px;padding:24px;}
.icon{width:80px;height:80px;border-radius:18px;display:block;margin:0 auto;}
.title{color:white;font-size:1.1rem;font-weight:700;text-align:center;}
.sub{color:rgba(255,255,255,0.5);font-size:0.8rem;text-align:center;line-height:1.6;}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,0.15);border-top-color:#F5C842;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg)}}
.manual{margin-top:10px;color:rgba(255,255,255,0.4);font-size:0.72rem;text-align:center;}
.manual a{color:#F5C842;text-decoration:none;font-weight:700;}
</style>
</head>
<body>
<img class="icon" src="https://download.dovelingua.com/English%20Dove%20App/Logo%20-%20icon.png" alt="English Dove"/>
<div class="title">A preparar o teu download...</div>
<div class="spinner"></div>
<div class="sub">O English Dove está a ser descarregado.<br/>Aguarda um momento.</div>
<div class="manual">O download não começou? <a id="manualLink" href="#">Clica aqui</a></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const APK = 'https://download.dovelingua.com/English_Dove.apk';
document.getElementById('manualLink').href = APK;

const app = initializeApp({
  apiKey:            'AIzaSyDFxVGUlDJj44e9kDFCRcZ8DfZt9hreX3M',
  authDomain:        'english-dove.firebaseapp.com',
  projectId:         'english-dove',
  storageBucket:     'english-dove.firebasestorage.app',
  messagingSenderId: '799562330961',
  appId:             '1:799562330961:web:953f0abca44d3b54f2d970'
});

const db = getFirestore(app);

async function trackAndDownload() {
  try {
    const now = new Date();
    await addDoc(collection(db, 'app_downloads'), {
      timestamp:   serverTimestamp(),
      date:        now.toISOString().split('T')[0],         // "2026-06-08"
      hour:        now.getHours(),                           // 14
      dayOfWeek:   now.toLocaleDateString('pt-PT', { weekday:'long' }),
      month:       now.toLocaleDateString('pt-PT', { month:'long', year:'numeric' }),
      userAgent:   navigator.userAgent,
      platform:    navigator.platform || 'unknown',
      language:    navigator.language || 'unknown',
      version:     'v1.0.0',
    });
  } catch(e) {
    // Silent — still download even if logging fails
    console.warn('Track error:', e);
  }
  // Trigger download
  const a = document.createElement('a');
  a.href = APK;
  a.download = 'English_Dove.apk';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// Small delay so spinner shows, then track + download
setTimeout(trackAndDownload, 800);
</script>
</body>
</html>
